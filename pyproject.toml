[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelagent"
version = "0.1.0"
description = "Real travel prices with provenance, for trip planning with Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
scrape = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["mcp>=2.0", "playwright>=1.45"]

[project.scripts]
travelagent = "travelagent.cli:main"
travelagent-mcp = "travelagent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["travelagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
